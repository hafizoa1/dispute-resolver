spring.application.name=dispute-resolver
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# In-memory H2 until the real database is chosen; data is lost on restart.
spring.datasource.url=jdbc:h2:mem:disputes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.h2.console.enabled=true
# Hibernate builds the schema for now; switch to validate once Liquibase owns migrations.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.evidence.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
