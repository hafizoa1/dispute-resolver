spring.application.name=dispute-resolver
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Defaults match the local dev role created for this project; override via
# env vars for anything beyond a laptop (DB_URL/DB_USERNAME/DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/disputes}
spring.datasource.username=${DB_USERNAME:dispute_resolver}
spring.datasource.password=${DB_PASSWORD:dispute_resolver}

# Liquibase now owns the schema (src/main/resources/db/changelog) - Hibernate
# only checks the entities against it, never generates DDL itself. Explicit
# path because Spring Boot 4's default Liquibase location is a .yaml file,
# not .xml.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.evidence.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
